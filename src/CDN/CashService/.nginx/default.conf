
server {
    listen 80;
    listen 7519;

    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.18.200.131;

    access_log /var/log/nginx/cdn_images.access.log main_ext;
    error_log /var/log/nginx/cdn_images.error.log warn;

    root /usr/share/nginx/images;
    index index.html;

    limit_req zone=static burst=50 nodelay;

    location / {
        try_files $uri $uri/ =404;

        server_tokens off;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type" always;
    }

    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|svgz|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status $upstream_cache_status;

        gzip_static on;

        tcp_nodelay off;
        open_file_cache max=5000 inactive=300s;
        open_file_cache_valid 60s;
        open_file_cache_min_uses 2;
        open_file_cache_errors off;

        add_header X-Content-Type-Options nosniff;

        access_log off;
        error_log /var/log/nginx/cdn_images.error.log;
    }

    location /healthcheck {
        access_log off;
        error_log off;

        default_type text/plain;
        add_header Content-Type text/plain;
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        return 200 "OK\n";
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx;
        internal;
    }
}
