
server {
    listen 80 default_server;
    listen 7519 default_server;
    server_name _;

    # Real IP configuration
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;

    # Logging
    access_log /var/log/nginx/cdn_images.access.log main_ext;
    error_log /var/log/nginx/cdn_images.error.log warn;

    # Root directory
    root /usr/share/nginx/images;
    index index.html;

    # Rate limiting
    limit_req zone=static burst=50 nodelay;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Main location block
    location / {
        try_files $uri $uri/ =404;

        server_tokens off;

        # CORS headers for CDN
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Content-Length 0 always;
            return 204;
        }
    }

    # Optimized image handling
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|svgz|webp|avif|bmp|tiff|tif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Content-Type-Options "nosniff" always;

        # Performance optimizations
        gzip_static on;
        tcp_nodelay off;

        # File cache optimization
        open_file_cache max=5000 inactive=300s;
        open_file_cache_valid 60s;
        open_file_cache_min_uses 2;
        open_file_cache_errors off;

        # Disable access log for static files
        access_log off;
        error_log /var/log/nginx/cdn_images.error.log;

        # Handle missing files
        try_files $uri =404;
    }

    # Font files optimization
    location ~* \.(?:woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;

        access_log off;
        error_log /var/log/nginx/cdn_images.error.log;
    }

    # Health check endpoint
    location /healthcheck {
        access_log off;
        error_log off;

        default_type text/plain;
        add_header Content-Type text/plain;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";

        return 200 "OK\n";
    }

    # Security: Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Deny access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Security: Deny access to sensitive files
    location ~* \.(?:htaccess|htpasswd|ini|log|sh|sql|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx;
        internal;
    }

    # Custom 404 page
    location = /404.html {
        root /usr/share/nginx;
        internal;
    }
}
