review:
  enabled: true
  auto_review_on_open: true   # Tự review khi có MR mới
  auto_review_on_push: true   # Review lại khi push thêm commit vào MR
  reviewers:
    - "coderabbit"            # Bot reviewer
  rules:
    - check: style
    - check: complexity
    - check: security
    - check: duplication
  languages: ["ts", "csharp"]
