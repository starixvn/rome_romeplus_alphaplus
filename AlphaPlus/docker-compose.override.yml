version: '3.4'

services:
    identity-api:
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ASPNETCORE_URLS=http://0.0.0.0:5000
        ports:
            - '5200:5000'

    assets:
        ports:
            - '5100:8080'

    login:
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ASPNETCORE_URLS=http://0.0.0.0:5000
        ports:
            - '5001:5000'
