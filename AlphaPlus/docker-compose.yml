version: '3.4'

services:
    settings-site:
        image: ${REGISTRY:-alphaplus}/settings.site:${PLATFORM:-linux}-${TAG:-latest}
        build:
            context: .
            dockerfile: Web/Settings/Settings.Site/Dockerfile
        restart: always

    tickets-api:
        image: ${REGISTRY:-alphaplus}/tickets.api:${PLATFORM:-linux}-${TAG:-latest}
        build:
            context: .
            dockerfile: Services/Tickets/API/Dockerfile
        restart: always

    identity-api:
        image: ${REGISTRY:-alphaplus}/identity.api:${PLATFORM:-linux}-${TAG:-latest}
        build:
            context: .
            dockerfile: Services/Identity/Identity.API/Dockerfile
        restart: always

    tickets-site:
        image: ${REGISTRY:-alphaplus}/tickets.site:${PLATFORM:-linux}-${TAG:-latest}
        build:
            context: .
            dockerfile: Web/Tickets/Dockerfile
        restart: always
        depends_on:
            - tickets-api

    assets:
        image: ${REGISTRY:-alphaplus}/assets:${PLATFORM:-linux}-${TAG:-latest}
        build:
            context: .
            dockerfile: Web/assets/Dockerfile
        restart: always

    main:
        image: ${REGISTRY:-alphaplus}/main:${PLATFORM:-linux}-${TAG:-latest}
        build:
            context: .
            dockerfile: Web/Main/Alpha.Main.Site/Dockerfile
            target: final
        restart: always
        depends_on:
            - identity-api
        develop:
            watch:
                - action: rebuild
            path: .

    login:
        image: ${REGISTRY:-alphaplus}/login:${PLATFORM:-linux}-${TAG:-latest}
        build:
            context: .
            dockerfile: Web/Before/Fanex.Alpha.Before/Dockerfile
        restart: always

    proxy:
        build: proxy
        ports:
            - 5100:80
        depends_on:
            - main
