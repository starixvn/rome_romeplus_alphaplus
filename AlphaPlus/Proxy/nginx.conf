server {
    listen       80;
    server_name  localhost;
    location / {
        proxy_hide_header Access-Control-Allow-Origin;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header Content-Type text/plain;
        return 200 'Hello, I am Alpha+';
    }

    location /site-main {
        proxy_pass   http://main:5000;
    }


}