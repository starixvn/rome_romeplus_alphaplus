<!--ExternalResources-->
<link href="../../../App_Themes/Apo/Components/DateTimeControl/JSCalendar/jscal2.min.css" rel="stylesheet" type="text/css" />
<link href="../../../App_Themes/Apo/Components/DateTimeControl/JSCalendar/steel/steel.min.css" rel="stylesheet" type="text/css" />
<script src="js/jscal2.js" type="text/javascript"></script>

<script src="js/lang/en.js" type="text/javascript"></script>

<!--/ExternalResources-->

<table cellpading="0" cellspacing="0" border="0">
    <tr>
        <td>
            <input id="{DateTextBoxId}" class="date_no" value="{CurrentDate}" type="text" size="13"
                name="{DateTextBoxId}" readonly="readonly" />
        </td>
        <td>
            <input type="image" alt="" src="../../../App_Themes/Apo/Images/cal.gif" id="{TriggerId}" title="Date selector" class="icon-cal" onclick="javascript:return false;" />
                        
           <!-- <img alt="" src="../../../_GlobalResources/Images/cal.gif" id="{TriggerId}" title="Date selector" 
                style="margin: 0px; cursor: pointer" /> -->               
        </td>
    </tr>
</table>


<script type="text/javascript">
    function CalendarOnSelect() {
        if($("ddlSelectDate"))
            $("ddlSelectDate").value = 8;
    }
    
    var {DateTextBoxId} = Calendar.setup({
        align: "Bl/ / /B",
        animation:false,
        trigger: "{TriggerId}",
        inputField: "{DateTextBoxId}",
        min: {MinDate},
        max: {MaxDate},
        dateFormat: "%m/%d/%Y",
        weekNumbers:false,
        onSelect: function() {
            CalendarOnSelect();                
            this.hide();
        
        }
    });
</script>
