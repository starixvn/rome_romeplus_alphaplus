<!--ExternalResources-->
<link href='../App_Themes/Apo/Components/RefreshCountDown/RefreshCountDown{DarkModeName}.min.css' rel="stylesheet" type="text/css" />
<script src="RefreshCountDown.js" type="text/javascript"></script>
<!--/ExternalResources-->
<div class="dropdown-refresh">
    <div class="btnCountDown">
        <div id="CountDownRefresh" class="btnRefresh" onclick="return CountDownRefresh_Refresh()" title="{static:LocalResources.UIComponentsLang.refresh}"></div>
        <div class="btnDown" onclick="CountDownRefresh_DoOpenOption(this);"></div>
    </div>
    <ul id="CountDownMenu" style="display:none;" class="panelDown">
        <!--Seconds-->
        <li id="option{i}" class="menuitem {OptionClass}" onclick="CountDownRefresh_SaveOption(this.id);">
            {SecondNum}{static:LocalResources.UIComponentsLang.sec}
        </li>
        <!--/Seconds-->
    </ul>
</div>

<script type="text/javascript">
    var refreshCountDownId = "{RefreshCountDownId}";
    var initCountDown = { initCountDown };
    var loadingTxt = "<span class='miniloading'>{static:LocalResources.UIComponentsLang.loading}</span>";
    var countDownRefreshFunc = "{CountDownRefreshFunc}()";
</script>
