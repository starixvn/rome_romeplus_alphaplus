<link href="PopupMessage.css" rel="stylesheet" type="text/css" />
<div id="container_outer">
    <div id="container">
        <table style="border-collapse: collapse" width="100%">
            <tr>
                <td>
                    <div id="popup_contents">
                        <span class="text_container">{content}</span>
                     </div>
                </td>
                <td valign="top" class="r">
                    <a style="cursor: pointer;" onclick="$('container').style.visibility = 'hidden';">
                        <img border="0" src="../../_GlobalResources/Images/icon_close.jpg" alt="{static:LocalResources.UIComponentsLang.close}" title="{static:LocalResources.UIComponentsLang.close}" />
                    </a>
                </td>
            </tr>
        </table>
    </div>
</div>
