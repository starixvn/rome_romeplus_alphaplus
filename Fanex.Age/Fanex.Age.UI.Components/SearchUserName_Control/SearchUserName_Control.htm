<table id="tblSearch">
    <tr>
        <td>
            {username}
        </td>
        <td>
            <input type="text" class="{textClass}" name="txtUserName" id="txtUserName" value="{value}" onkeypress="onKeyPressUser('dSubmit',event);" onclick="onclickUser('{enterusername}')" onblur="onblurUser('{enterusername}')" autocomplete="off" />
        </td>

        <td>{status}</td>
        <td>
            <div id="box_option">
                <select id="statusFilter" name="statusFilter">
                    <!--option-->
                    <option value="{optionValue}" {selected}>{optionText}</option>
                    <!--/option-->
                </select>
            </div>
        </td>
        <td class="elm-auto-transfer hidden">{static:LocalResources.UIComponentsLang.autoTransfer}</td>
        <td class="elm-auto-transfer hidden">
            <div id=" box_option_auto_transfer">
                <select id="sel-auto-transfer" name="sel-auto-transfer">
                    <option value="2">{static:LocalResources.UIComponentsLang.all}</option>
                    <option value="1">{static:LocalResources.UIComponentsLang.Enabled}</option>
                    <option value="0">{static:LocalResources.UIComponentsLang.disabled}</option>
                </select>
            </div>
        </td>
        <td>
            <!--CheckingFilter-->
            <div id="box_checking_filter"> <input type="checkbox" id="{chkId}" name="{chkId}" onclick=" CheckingFilter();" {ischecked} /> {CheckBoxText}  </div>
            <!--/CheckingFilter-->
            <div class="container-btn">
                <input id="dSubmit" type="button" value="{submit}" class="buttonSubmit" onclick="{onClick_function}" />
            </div>
            <div class="shadow" id="shadow" />
            <div class="output" id="output" />
            <script src="SearchUserName_Control.js" type="text/javascript"></script>
            <script src="autocomplete.js" type="text/javascript"></script>
        </td>
    </tr>        
</table>
