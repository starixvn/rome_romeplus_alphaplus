<!--ExternalResources-->

<link href="Paging.css" rel="stylesheet" type="text/css" />
<script src="Paging.js" type="text/javascript"></script>

<!--/ExternalResources-->

<div id="{id}" class="{pageclass}" pagesize="{pagesize}" currentindex="{currentindex}" rowcount="{rowcount}" pagecount="{pagecount}">

    <span {disabledFirst} id="btnFirst{id}" type="button" onclick="{id}.First(this)" class="icon pagingFirst"></span>
    <span {disabledPrev} id="btnPrev{id}" type="button" onclick="{id}.Move(this, -1)" class="icon pagingPrev"></span>

    <span class="pagingSeperator"></span>
    {static:LocalResources.UIComponentsLang.tpage}
    <input id="txt{id}" type="text" class="pagingCurrent" maxlength="4" size="2" value="{currentindex}" onkeydown="{id}.DoEnter(event, '{id}.Go()')" />
    {static:LocalResources.UIComponentsLang.Of_Pager} {pagecount}
    <span class="pagingSeperator"></span>

    <span {disabledNext} id="btnNext{id}" type="button" onclick="{id}.Move(this, 1)" class="icon pagingNext"></span>
    <span {disabledLast} id="btnLast{id}" type="button" onclick="{id}.Last(this)" class="icon pagingLast"></span>
    <!--SelPageSize-->
    {selPageSize}
    <!--/SelPageSize-->
</div>

<script type="text/javascript">
    var {id} = new Paging('{id}');
</script>
