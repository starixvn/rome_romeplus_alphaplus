<div data-bind="if: displayTransferCondition">
    <div class="transferCondition">
        <div class="headerTab">
            {static:LocalResources.PTEngineLang.accbalancetrancondition}
        </div>
        <div>
            {TransferConditions_Message}
            <label for="rdDaily">
                <input type="radio" onclick="Fanex.Customer.SelectTransferTime();" id="rdDaily" name="transferCondition"
                       value="00000000" checked />{static:LocalResources.PTEngineLang.daily}
            </label>
        </div>
        <div class="line">
        </div>
        <div id="alldays">
            <label for="rdWeekly">
                <input type="radio" onclick="Fanex.Customer.SelectTransferTime();" id="rdWeekly"
                       name="transferCondition" value="00000001" />{static:LocalResources.PTEngineLang.weekly} &nbsp;&nbsp;
            </label>
            <span>
                <label for="chkMon">
                    <input name="chkMon" id="chkMon" type="checkbox" onclick="return Fanex.Customer.ChooseDate();"
                           disabled />{static:LocalResources.PTEngineLang.mon}&nbsp;&nbsp;
                </label>
                <label for="chkTue">
                    <input name="chkTue" id="chkTue" type="checkbox" onclick="return Fanex.Customer.ChooseDate();"
                           disabled />{static:LocalResources.PTEngineLang.tue}&nbsp;&nbsp;
                </label>
                <label for="chkWed">
                    <input name="chkWed" id="chkWed" type="checkbox" onclick="return Fanex.Customer.ChooseDate();"
                           disabled />{static:LocalResources.PTEngineLang.wed}&nbsp;&nbsp;
                </label>
                <label for="chkThurs">
                    <input name="chkThurs" id="chkThurs" type="checkbox" onclick="return Fanex.Customer.ChooseDate();"
                           disabled />{static:LocalResources.PTEngineLang.thurs}&nbsp;&nbsp;
                </label>
                <label for="chkFri">
                    <input name="chkFri" id="chkFri" type="checkbox" onclick="return Fanex.Customer.ChooseDate();"
                           disabled />{static:LocalResources.PTEngineLang.fri}&nbsp;&nbsp;
                </label>
                <label for="chkSat">
                    <input name="chkSat" id="chkSat" type="checkbox" onclick="return Fanex.Customer.ChooseDate();"
                           disabled />{static:LocalResources.PTEngineLang.sat}&nbsp;&nbsp;
                </label>
                <label for="chkSun">
                    <input name="chkSun" id="chkSun" type="checkbox" onclick="return Fanex.Customer.ChooseDate();"
                           disabled />{static:LocalResources.PTEngineLang.sun}
                </label>
            </span>
        </div>
    </div>
</div>
